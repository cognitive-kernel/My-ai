[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai"
version = "0.2.0"
description = "Local-first personal AI learning and coding agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "psutil>=6,<8",
  "cryptography>=50,<51",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=0.6,<2",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "python-multipart>=0.0.9,<1",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

sqlserver = ["mssql-python>=1.14,<2"]
mysql = ["mysql-connector-python>=9,<27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser end-to-end smoke tests"]

[tool.setuptools.packages.find]
include = ["my_ai*"]
