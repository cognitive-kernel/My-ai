[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai"
version = "0.2.0"
description = "Local-first personal AI learning and coding agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
