name: semantic-tooling

on:
  push:
    branches:
      - feat/semantic-software-agent-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile changed runtime modules
        run: python -m compileall -q my_ai
      - name: Run semantic tooling tests
        run: python -m pytest tests/test_semantic_tooling.py -q
