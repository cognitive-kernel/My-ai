name: Focused regression tests
run-name: focused-regression @ ${{ github.sha }}
permissions:
  contents: read
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-file:
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_advanced_infra.py
          - tests/test_learning_progress.py
          - tests/test_llm_retry_policy.py
          - tests/test_provider_catalog.py
          - tests/test_roadmap_02_learning.py
          - tests/test_roadmap_05_memory.py
          - tests/test_roadmap_09_scheduler.py
          - tests/test_settings_store.py
          - tests/test_version_aware_learning.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: pip install -r requirements.lock
      - run: pip install -e .[dev] --no-deps
      - name: Run one test file (30s limit)
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 30s pytest -q "${{ matrix.test_file }}"
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "TEST_TIMEOUT file=${{ matrix.test_file }} timeout=30s"
          fi
          exit "$rc"
