name: CI
run-name: ${{ github.workflow }} @ ${{ github.sha }}
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: pip install -r requirements.lock
      - run: pip install -e .[dev] --no-deps
      - run: python -m compileall -q my_ai tests
      - run: ruff check my_ai --select F
      - run: mypy my_ai --ignore-missing-imports
      - run: bandit -r my_ai -q -lll
      - run: pip-audit
      - run: pytest -q
      - run: python scripts/regression_gate.py
      - name: Upload regression history
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-history-${{ github.sha }}
          path: evals/history/
      - run: docker build -t my-ai-ci .
      - run: EXECUTOR_SHARED_TOKEN=ci-test-token docker compose config
