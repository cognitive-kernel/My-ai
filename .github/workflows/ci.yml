name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: pip install -e .[dev]
      - run: python -m compileall -q my_ai tests
      - run: ruff check my_ai --select F
      - run: mypy my_ai --ignore-missing-imports
      - run: bandit -r my_ai -q -lll
      - run: pip-audit
      - run: pytest -q
      - run: docker build -t my-ai-ci .
