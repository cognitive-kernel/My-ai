name: CI
run-name: ${{ github.workflow }} @ ${{ github.sha }}
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: pip install -r requirements.lock
      - run: pip install -e .[dev] --no-deps
      - name: Compile source and tests
        shell: bash
        run: |
          set +e
          python -m compileall my_ai tests > compile-errors.txt 2>&1
          rc=$?
          cat compile-errors.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Upload compile diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: compile-diagnostics-${{ github.sha }}
          path: compile-errors.txt
      - run: python scripts/architecture_audit.py
      - name: Architecture E2E audit
        shell: bash
        run: |
          set +e
          python scripts/architecture_e2e_audit.py > architecture-e2e.txt 2>&1
          rc=$?
          cat architecture-e2e.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Upload architecture E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: architecture-e2e-diagnostics-${{ github.sha }}
          path: architecture-e2e.txt
      - name: Ruff F diagnostics and autofix
        shell: bash
        run: |
          set +e
          ruff check my_ai --select F --fix > ruff-f.txt 2>&1
          rc=$?
          cat ruff-f.txt
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          ruff check my_ai --select F
      - name: Upload Ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ruff-diagnostics-${{ github.sha }}
          path: ruff-f.txt
      - name: Mypy diagnostics
        continue-on-error: true
        shell: bash
        run: |
          mypy my_ai --ignore-missing-imports > mypy.txt 2>&1 || true
          cat mypy.txt
      - name: Upload Mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mypy-diagnostics-${{ github.sha }}
          path: mypy.txt
      - name: Bandit
        continue-on-error: true
        run: bandit -r my_ai -q -lll
      - name: pip-audit
        continue-on-error: true
        run: pip-audit
      - name: Run tests one file at a time with 30s timeout
        shell: bash
        run: |
          set -e
          : > test-results.txt
          while IFS= read -r -d '' test_file; do
            echo "===== START $test_file =====" | tee -a test-results.txt
            set +e
            timeout --signal=TERM --kill-after=5s 30s pytest -q "$test_file" 2>&1 | tee -a test-results.txt
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
              echo "===== FAIL $test_file rc=$rc =====" | tee -a test-results.txt
              exit "$rc"
            fi
            echo "===== PASS $test_file rc=$rc =====" | tee -a test-results.txt
          done < <(find tests -maxdepth 2 -type f -name 'test_*.py' -print0 | sort -z)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ github.sha }}
          path: test-results.txt
      - run: python scripts/regression_gate.py
      - name: Upload regression history
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-history-${{ github.sha }}
          path: evals/history/
      - run: docker build -t my-ai-ci .
      - run: EXECUTOR_SHARED_TOKEN=ci-test-token docker compose config
