name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: pip install -e .[dev]
      - run: python -m compileall -q my_ai tests
      - run: ruff check my_ai tests --select E9,F
      - run: mypy my_ai --ignore-missing-imports
      - run: bandit -r my_ai -q -lll
      - run: pip-audit
      - run: pytest -q
      - run: docker build -t my-ai-ci .
      - run: docker build -f Dockerfile.executor -t my-ai-executor-ci .
