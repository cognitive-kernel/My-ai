name: ollama-e2e
run-name: ${{ github.workflow }} @ ${{ github.sha }}
permissions:
  contents: read
concurrency:
  group: ollama-e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          OLLAMA_HOST=0.0.0.0:11434 OLLAMA_KEEP_ALIVE=5m nohup ollama serve > /tmp/ollama.log 2>&1 &
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/tmp/ollama-tags.json; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/ollama.log || true
            exit 1
          fi
      - name: Pull small E2E model
        run: |
          for attempt in 1 2 3 4 5; do
            if OLLAMA_HOST=127.0.0.1:11434 ollama pull qwen2.5:0.5b; then exit 0; fi
            sleep $((attempt * 10))
          done
          OLLAMA_HOST=127.0.0.1:11434 ollama list
          cat /tmp/ollama.log || true
          exit 1
      - name: Install project
        run: pip install -e .[dev]
      - name: Run Ollama smoke test
        env:
          OLLAMA_MODEL: qwen2.5:0.5b
        run: python -c "from my_ai.llm import OllamaClient; r=OllamaClient().chat('Reply with exactly OK'); print(r); assert 'OK' in r.upper()"
      - name: Run live semantic router and Persian response baseline
        env:
          OLLAMA_MODEL: qwen2.5:0.5b
          ROUTER_MODEL: qwen2.5:0.5b
          CODING_MODEL: qwen2.5:0.5b
          FALLBACK_MODEL: qwen2.5:0.5b
          ROUTER_LLM_ENABLED: "true"
        run: |
          python - <<'PY'
          from my_ai.agent import Agent
          from my_ai.eval_harness import PERSIAN_RESPONSE_BASELINE, run_response_eval
          from my_ai.infra.llm import OllamaClient
          from my_ai.db import init_db, execute
          init_db()
          sid=execute("INSERT INTO chat_sessions(title,kind) VALUES(?,?)", ("CI eval", "chat"))
          agent=Agent(llm=OllamaClient())
          result=run_response_eval(lambda prompt: agent.chat(prompt, sid), PERSIAN_RESPONSE_BASELINE, baseline=0.55)
          print(result)
          assert result["baseline_met"], result
          assert result["pass_rate"] >= 0.5, result
          PY
      - name: Start application
        env:
          OLLAMA_MODEL: qwen2.5:0.5b
          ROUTER_MODEL: qwen2.5:0.5b
          CODING_MODEL: qwen2.5:0.5b
          FALLBACK_MODEL: qwen2.5:0.5b
          RESOURCE_WAIT_SECONDS: 15
          LEARNING_MAX_CONCURRENT_WORKERS: 1
        run: |
          nohup uvicorn my_ai.api:app --host 127.0.0.1 --port 8001 > /tmp/my-ai.log 2>&1 &
          echo $! > /tmp/my-ai.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8001/health && break || sleep 2; done
      - name: Run authenticated API and UI smoke tests
        run: |
          test "$(curl -s -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:8001/login)" = "200"
          test "$(curl -s -o /tmp/register.json -w '%{http_code}' -c /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-password-123","display_name":"CI"}' http://127.0.0.1:8001/auth/register)" = "200"
          test "$(curl -s -o /tmp/home.html -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:8001/)" = "200"
          learning_status_code="$(curl -s -o /tmp/learning-status.json -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:8001/learning/status)"
          test "$learning_status_code" = "200"
          python - <<'PY'
          import json
          data=json.load(open("/tmp/learning-status.json", encoding="utf-8"))
          assert "languages" in data and "courses" in data
          PY
      - name: Run Docker compose E2E smoke
        env:
          EXECUTOR_SHARED_TOKEN: ci-test-token
          MYAI_HOST_PORT: 8002
          OLLAMA_BASE_URL: http://host.docker.internal:11434
          OLLAMA_MODEL: qwen2.5:0.5b
          ROUTER_MODEL: qwen2.5:0.5b
          CODING_MODEL: qwen2.5:0.5b
          FALLBACK_MODEL: qwen2.5:0.5b
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          trap 'docker compose down -v --remove-orphans 2>/dev/null || true' EXIT
          mkdir -p data
          sudo chown -R 10001:10001 data
          docker compose up -d --build
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8002/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker compose ps
            docker compose logs --no-color --tail=200 my-ai executor
            exit 1
          fi
          health_json="$(curl -fsS http://127.0.0.1:8002/health)"
          echo "$health_json"
          echo "$health_json" | grep -q '"status":"ok"'
          login_code="$(curl -s -o /tmp/compose-login.json -w '%{http_code}' -c /tmp/compose-cookies.txt -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-password-123"}' http://127.0.0.1:8002/auth/login)"
          echo "login_code=$login_code"
          cat /tmp/compose-login.json
          if [ "$login_code" != "200" ]; then docker compose logs --no-color --tail=200 my-ai executor; exit 1; fi
