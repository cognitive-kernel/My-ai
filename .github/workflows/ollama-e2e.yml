name: ollama-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ollama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags && break || sleep 2; done
      - name: Pull small E2E model
        run: ollama pull qwen2.5:0.5b
      - name: Install project
        run: pip install -e .[dev]
      - name: Run Ollama smoke test
        env:
          OLLAMA_MODEL: qwen2.5:0.5b
        run: python -c "from my_ai.llm import OllamaClient; r=OllamaClient().chat('Reply with exactly OK'); print(r); assert 'OK' in r.upper()"
      - name: Start application
        env:
          OLLAMA_MODEL: qwen2.5:0.5b
          ROUTER_MODEL: qwen2.5:0.5b
          CODING_MODEL: qwen2.5:0.5b
          FALLBACK_MODEL: qwen2.5:0.5b
        run: |
          nohup uvicorn my_ai.api:app --host 127.0.0.1 --port 8000 > /tmp/my-ai.log 2>&1 &
          echo $! > /tmp/my-ai.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
      - name: Run authenticated API and UI smoke tests
        run: |
          test "$(curl -s -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:8000/login)" = "200"
          test "$(curl -s -o /tmp/register.json -w '%{http_code}' -c /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-password-123","display_name":"CI"}' http://127.0.0.1:8000/auth/register)" = "200"
          test "$(curl -s -o /tmp/home.html -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:8000/)" = "200"
          grep -q 'Self-Update' /tmp/home.html
          grep -q 'Self-Repair' /tmp/home.html
          grep -q 'SpeechRecognition' /tmp/home.html
          test "$(curl -s -o /tmp/metrics.json -w '%{http_code}' -b /tmp/cookies.txt http://127.0.0.1:8000/health/metrics)" = "200"
          test "$(curl -s -o /tmp/chat.json -w '%{http_code}' -b /tmp/cookies.txt -H 'Content-Type: application/json' -d '{"message":"Reply with exactly OK"}' http://127.0.0.1:8000/chat)" = "200"
          grep -qi 'OK' /tmp/chat.json
      - name: Run Docker compose E2E smoke
        env:
          EXECUTOR_SHARED_TOKEN: ci-test-token
          OLLAMA_MODEL: qwen2.5:0.5b
          ROUTER_MODEL: qwen2.5:0.5b
          CODING_MODEL: qwen2.5:0.5b
          FALLBACK_MODEL: qwen2.5:0.5b
        run: |
          if test -f /tmp/my-ai.pid; then
            kill "$(cat /tmp/my-ai.pid)" 2>/dev/null || true
            for i in $(seq 1 10); do
              if ! kill -0 "$(cat /tmp/my-ai.pid)" 2>/dev/null; then break; fi
              sleep 1
            done
          fi
          docker compose down -v --remove-orphans 2>/dev/null || true
          trap 'docker compose down -v --remove-orphans 2>/dev/null || true' EXIT
          mkdir -p data
          sudo chown -R 10001:10001 data
          docker compose up -d --build
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker compose ps
            docker compose logs --no-color --tail=200 my-ai executor
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          test "$(curl -s -o /tmp/compose-register.json -w '%{http_code}' -c /tmp/compose-cookies.txt -H 'Content-Type: application/json' -d '{"username":"compose-admin","password":"compose-password-123","display_name":"Compose CI"}' http://127.0.0.1:8000/auth/register)" = "200"
          test "$(curl -s -o /tmp/compose-chat.json -w '%{http_code}' -b /tmp/compose-cookies.txt -H 'Content-Type: application/json' -d '{"message":"Reply with exactly OK"}' http://127.0.0.1:8000/chat)" = "200"
          grep -qi 'OK' /tmp/compose-chat.json