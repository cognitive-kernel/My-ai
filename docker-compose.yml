services:
  my-ai:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      ROUTER_MODEL: ${ROUTER_MODEL:-qwen2.5:1.5b}
      CODING_MODEL: ${CODING_MODEL:-qwen2.5:7b}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-6}
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-0}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      MYAI_CACHE_TTL: 60
      EXECUTOR_MODE: remote
      EXECUTOR_SERVICE_URL: http://executor:9000/run
      EXECUTOR_SHARED_TOKEN: ${EXECUTOR_SHARED_TOKEN:?set EXECUTOR_SHARED_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - executor
    restart: unless-stopped

  executor:
    build: .
    command: ["uvicorn","my_ai.executor_service:app","--host","0.0.0.0","--port","9000"]
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      EXECUTOR_SHARED_TOKEN: ${EXECUTOR_SHARED_TOKEN:?set EXECUTOR_SHARED_TOKEN}
      EXECUTOR_IMAGE: python:3.11-slim
      EXEC_TIMEOUT: 10
      EXEC_MEMORY: 256m
      EXEC_CPUS: 1.0
      EXEC_PIDS: 64
      EXEC_OUTPUT_CHARS: 12000
    restart: unless-stopped
